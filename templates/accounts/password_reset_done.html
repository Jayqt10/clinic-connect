<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Clinic Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f8f8;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 50px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e0f4f5;
            color: #087f8c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            color: #173f46;
            margin-bottom: 15px;
            font-size: 30px;
        }

        p {
            color: #687b80;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            color: #087f8c;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            ✓
        </div>

        <h1>
            Check Your Email
        </h1>

        <p>
            If an account exists with the email address you entered,
            we have sent instructions for resetting your password.
        </p>

        <p>
            Please check your inbox and follow the password reset link.
        </p>

        <a href="{% url 'accounts:login' %}">
            Back to Login
        </a>

    </div>

</body>
</html>
