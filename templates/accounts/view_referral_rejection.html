{% extends 'base.html' %}

{% block title %}Rejection Reason{% endblock %}

{% block content %}

<style>
    .page-header {
        margin-bottom: 20px;
    }

    .page-header h1 {
        color: #fff;
        font-size: 24px;
        margin-bottom: 5px;
    }

    .page-header p {
        color: #819092;
        font-size: 13px;

        border: 1px solid #172426;
        border-radius: 10px;
        padding: 22px;
    }

        color: #fff;
        font-size: 17px;

        margin-bottom: 18px;

        color: #819092;
        font-size: 12px;
        margin-bottom: 6px;
    }

    .reason-box {
        background: #0b1415;

        padding: 16px;
        color: #fca5a5;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .back-button {
        display: inline-block;
        background: #1f2937;
        border: 1px solid #374151;
        color: #cbd5e1;
        padding: 9px 13px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
    }

    .back-button:hover {
        background: #374151;
        color: #fff;
    }
</style>

<div class="page-header">
    <h1>Rejection Reason</h1>
    <p>View the reason provided by the clinic staff.</p>
</div>

        {{ referral.student_name }}

    </a>

</div>

{% endblock %}
